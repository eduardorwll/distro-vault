name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp target/release/distro-vault dist/distro-vault
          chmod +x dist/distro-vault
          strip --strip-all dist/distro-vault
          tar -czf dist/distro-vault-linux-x86_64.tar.gz -C dist distro-vault
          cd dist
          sha256sum distro-vault-linux-x86_64.tar.gz > distro-vault-linux-x86_64.tar.gz.sha256
          sha256sum distro-vault > distro-vault.sha256
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/distro-vault
            dist/distro-vault-linux-x86_64.tar.gz
            dist/distro-vault-linux-x86_64.tar.gz.sha256
            dist/distro-vault.sha256
