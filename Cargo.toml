[workspace]
members = [
    "crates/domain",
    "crates/application",
    "crates/adapter-system",
    "crates/adapter-browser",
    "crates/adapter-agents",
    "crates/adapter-storage",
    "crates/adapter-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Eduardo <eduardo@local>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/eduardorwll/distro-vault"

[workspace.dependencies]
# Internal Workspace Crates
domain = { path = "crates/domain" }
application = { path = "crates/application" }
adapter-system = { path = "crates/adapter-system" }
adapter-browser = { path = "crates/adapter-browser" }
adapter-agents = { path = "crates/adapter-agents" }
adapter-storage = { path = "crates/adapter-storage" }

# Serialization & Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Error Handling & Resilience
thiserror = "1.0"
anyhow = "1.0"

# Compression & File Systems
lz4_flex = "0.11"
zstd = "0.13"
tar = "0.4"
walkdir = "2.4"
tempfile = "3.10"
sha2 = "0.10"

# Database & Profiling
rusqlite = { version = "0.31", features = ["bundled"] }

# CLI & TUI Interface
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
indicatif = { version = "0.17", features = ["rayon"] }
console = "0.15"
ratatui = "0.30"
crossterm = "0.29"

# Testing & Mocking
mockall = "0.12"
