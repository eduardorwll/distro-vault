<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-domain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241b47"/>
      <stop offset="100%" stop-color="#16122d"/>
    </linearGradient>
    <linearGradient id="card-app" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card-cli" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2d48"/>
      <stop offset="100%" stop-color="#081826"/>
    </linearGradient>
    <linearGradient id="card-adapter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="card-external" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c0a02"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Connector Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1400" height="960" fill="url(#bg-grad)"/>

  <!-- Grid Decoration -->
  <g opacity="0.05">
    <path d="M 0,80 L 1400,80 M 0,160 L 1400,160 M 0,240 L 1400,240 M 0,320 L 1400,320 M 0,400 L 1400,400 M 0,480 L 1400,480 M 0,560 L 1400,560 M 0,640 L 1400,640 M 0,720 L 1400,720 M 0,800 L 1400,800 M 0,880 L 1400,880" stroke="#94a3b8" stroke-width="1"/>
    <path d="M 80,0 L 80,960 M 160,0 L 160,960 M 240,0 L 240,960 M 320,0 L 320,960 M 400,0 L 400,960 M 480,0 L 480,960 M 560,0 L 560,960 M 640,0 L 640,960 M 720,0 L 720,960 M 800,0 L 800,960 M 880,0 L 880,960 M 960,0 L 960,960 M 1040,0 L 1040,960 M 1120,0 L 1120,960 M 1200,0 L 1200,960 M 1280,0 L 1280,960" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Title Header -->
  <g transform="translate(60, 45)">
    <text x="0" y="24" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">distro-vault</text>
    <text x="175" y="24" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="1">CLEAN ARCHITECTURE WORKSPACE</text>
    <text x="0" y="48" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">Hexagonal Architecture (Ports &amp; Adapters) em Rust 2021 com Governança de Agentes</text>
  </g>

  <!-- LAYER 1: INBOUND / DRIVING ADAPTER (CLI) -->
  <g transform="translate(60, 120)" filter="url(#shadow)">
    <rect width="1280" height="90" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="1280" height="90" rx="14" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>
    
    <rect x="20" y="16" width="10" height="58" rx="5" fill="#38bdf8"/>
    <text x="45" y="40" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">DRIVING ADAPTER (INBOUND)</text>
    <text x="45" y="62" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">crates/adapter-cli</text>
    
    <!-- Pills of CLI capabilities -->
    <g transform="translate(380, 26)">
      <rect width="160" height="38" rx="8" fill="url(#card-cli)" stroke="#0284c7" stroke-width="1"/>
      <text x="80" y="23" text-anchor="middle" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Clap 4.5 CLI Parser</text>
    </g>
    <g transform="translate(560, 26)">
      <rect width="180" height="38" rx="8" fill="url(#card-cli)" stroke="#0284c7" stroke-width="1"/>
      <text x="90" y="23" text-anchor="middle" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Indicatif TUI Spinners</text>
    </g>
    <g transform="translate(760, 26)">
      <rect width="180" height="38" rx="8" fill="url(#card-cli)" stroke="#0284c7" stroke-width="1"/>
      <text x="90" y="23" text-anchor="middle" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Composition Root (main)</text>
    </g>
    <g transform="translate(960, 26)">
      <rect width="280" height="38" rx="8" fill="#0369a1" fill-opacity="0.2" stroke="#38bdf8" stroke-dasharray="4 4" stroke-width="1"/>
      <text x="140" y="23" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12">backup | restore | inspect | verify</text>
    </g>
  </g>

  <!-- CONNECTOR CLI -> APPLICATION -->
  <path d="M 700,210 L 700,260" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-blue)" fill="none"/>

  <!-- LAYER 2: APPLICATION LAYER (USE CASES) -->
  <g transform="translate(60, 260)" filter="url(#shadow)">
    <rect width="1280" height="120" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="1280" height="120" rx="14" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <rect x="20" y="20" width="10" height="80" rx="5" fill="#818cf8"/>
    <text x="45" y="48" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">APPLICATION LAYER</text>
    <text x="45" y="76" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">crates/application</text>
    <text x="45" y="94" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Orquestração desacoplada via traits</text>

    <!-- Use Cases Cards -->
    <g transform="translate(320, 25)">
      <rect width="210" height="70" rx="8" fill="url(#card-app)" stroke="#4f46e5" stroke-width="1.2"/>
      <text x="105" y="32" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">BackupPipeline</text>
      <text x="105" y="52" text-anchor="middle" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="11">Scan, Snapshot &amp; Manifest</text>
    </g>
    <g transform="translate(550, 25)">
      <rect width="210" height="70" rx="8" fill="url(#card-app)" stroke="#4f46e5" stroke-width="1.2"/>
      <text x="105" y="32" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">RestorePipeline</text>
      <text x="105" y="52" text-anchor="middle" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="11">Detect Host &amp; State Rehydrate</text>
    </g>
    <g transform="translate(780, 25)">
      <rect width="210" height="70" rx="8" fill="url(#card-app)" stroke="#4f46e5" stroke-width="1.2"/>
      <text x="105" y="32" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">InspectSnapshot</text>
      <text x="105" y="52" text-anchor="middle" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="11">Zero-Extract Header Peek</text>
    </g>
    <g transform="translate(1010, 25)">
      <rect width="240" height="70" rx="8" fill="url(#card-app)" stroke="#4f46e5" stroke-width="1.2"/>
      <text x="120" y="32" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">VerifyIntegrity</text>
      <text x="120" y="52" text-anchor="middle" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="11">SHA-256 &amp; Zip-Slip Checks</text>
    </g>
  </g>

  <!-- CONNECTOR APPLICATION -> DOMAIN -->
  <path d="M 700,380 L 700,430" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrow-purple)" fill="none"/>

  <!-- LAYER 3: CORE DOMAIN (ZERO I/O) -->
  <g transform="translate(60, 430)" filter="url(#shadow)">
    <rect width="1280" height="230" rx="16" fill="url(#card-domain)" stroke="#7c3aed" stroke-width="2"/>
    
    <!-- Header Domain -->
    <rect x="25" y="20" width="12" height="190" rx="6" fill="#c084fc"/>
    <text x="50" y="48" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">CORE DOMAIN LAYER (ZERO I/O)</text>
    <text x="50" y="78" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">crates/domain</text>
    <text x="50" y="100" fill="#ddd6fe" font-family="system-ui, sans-serif" font-size="12">Entidades, Value Objects e Contratos (Ports)</text>

    <!-- Sub-Block: Entidades e Value Objects -->
    <g transform="translate(50, 115)">
      <rect width="470" height="95" rx="10" fill="#1e1b4b" stroke="#6d28d9" stroke-width="1"/>
      <text x="15" y="24" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="11" font-weight="700">ENTITIES &amp; VALUE OBJECTS</text>
      <text x="15" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Manifest • ZenProfile • Space • Container</text>
      <text x="15" y="68" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">PackageEntry • AppImageEntry • UnixMode</text>
      <text x="15" y="88" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12">ProfileId • PackageName • DistroFamily • Checksum</text>
    </g>

    <!-- Sub-Block: Agent Governance Entity (Special Highlight) -->
    <g transform="translate(540, 115)">
      <rect width="360" height="95" rx="10" fill="#2e1065" stroke="#a855f7" stroke-width="1.5"/>
      <text x="15" y="24" fill="#f0abfc" font-family="system-ui, sans-serif" font-size="11" font-weight="800">AGENT GOVERNANCE ENTITY</text>
      <text x="15" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">AgentGovernance</text>
      <text x="15" y="68" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="12">RuleEntry (AGENTS.md, GEMINI.md)</text>
      <text x="15" y="86" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="12">SkillEntry (19 Skills) • QualityGates</text>
    </g>

    <!-- Sub-Block: Hexagonal Ports (Traits) -->
    <g transform="translate(920, 30)">
      <rect width="335" height="180" rx="10" fill="#130e2e" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="20" y="28" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="800">HEXAGONAL PORTS (TRAITS)</text>
      
      <g transform="translate(15, 42)">
        <rect width="305" height="24" rx="4" fill="#2e1065"/>
        <text x="10" y="16" fill="#ffffff" font-family="monospace" font-size="12">BrowserPort</text>
        <text x="295" y="16" text-anchor="end" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="10">mozLz4 / Hash</text>
      </g>
      <g transform="translate(15, 69)">
        <rect width="305" height="24" rx="4" fill="#2e1065"/>
        <text x="10" y="16" fill="#ffffff" font-family="monospace" font-size="12">PackagePort</text>
        <text x="295" y="16" text-anchor="end" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="10">Pacman/DNF/APT</text>
      </g>
      <g transform="translate(15, 96)">
        <rect width="305" height="24" rx="4" fill="#2e1065"/>
        <text x="10" y="16" fill="#ffffff" font-family="monospace" font-size="12">StoragePort</text>
        <text x="295" y="16" text-anchor="end" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="10">Tar/Zstd/ZipSlip</text>
      </g>
      <g transform="translate(15, 123)">
        <rect width="305" height="24" rx="4" fill="#2e1065"/>
        <text x="10" y="16" fill="#ffffff" font-family="monospace" font-size="12">AgentPort</text>
        <text x="295" y="16" text-anchor="end" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="10">Skills/Symlinks</text>
      </g>
      <g transform="translate(15, 150)">
        <rect width="305" height="24" rx="4" fill="#2e1065"/>
        <text x="10" y="16" fill="#ffffff" font-family="monospace" font-size="12">SystemPort</text>
        <text x="295" y="16" text-anchor="end" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="10">OS-Release/Proc</text>
      </g>
    </g>
  </g>

  <!-- CONNECTORS DOMAIN TO DRIVEN ADAPTERS -->
  <path d="M 220,710 L 220,660" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)" fill="none"/>
  <path d="M 540,710 L 540,660" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)" fill="none"/>
  <path d="M 860,710 L 860,660" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)" fill="none"/>
  <path d="M 1180,710 L 1180,660" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)" fill="none"/>

  <!-- LAYER 4: DRIVEN / OUTBOUND ADAPTERS -->
  <g transform="translate(60, 710)" filter="url(#shadow)">
    <!-- Adapter Browser -->
    <g transform="translate(0, 0)">
      <rect width="305" height="120" rx="12" fill="url(#card-adapter)" stroke="#059669" stroke-width="1.5"/>
      <text x="15" y="24" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">DRIVEN ADAPTER</text>
      <text x="15" y="46" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">crates/adapter-browser</text>
      <text x="15" y="66" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">• Codec mozLz40\0 puro (lz4_flex)</text>
      <text x="15" y="82" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">• Normalizador de installs.ini (Default=1)</text>
      <text x="15" y="98" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">• Rusqlite (commit WAL &amp; Spaces)</text>
    </g>

    <!-- Adapter System -->
    <g transform="translate(325, 0)">
      <rect width="305" height="120" rx="12" fill="url(#card-adapter)" stroke="#059669" stroke-width="1.5"/>
      <text x="15" y="24" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">DRIVEN ADAPTER</text>
      <text x="15" y="46" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">crates/adapter-system</text>
      <text x="15" y="66" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">• Leitor de /etc/os-release (Arch/Fedora/Deb)</text>
      <text x="15" y="82" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">• Dispatcher: Pacman, AUR, Flatpak, DNF</text>
      <text x="15" y="98" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">• Process Guard (.parentlock check)</text>
    </g>

    <!-- Adapter Agents -->
    <g transform="translate(650, 0)">
      <rect width="305" height="120" rx="12" fill="url(#card-adapter)" stroke="#059669" stroke-width="1.5"/>
      <text x="15" y="24" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">DRIVEN ADAPTER</text>
      <text x="15" y="46" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">crates/adapter-agents</text>
      <text x="15" y="66" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">• Scanner de 19 skills e YAML frontmatter</text>
      <text x="15" y="82" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">• Desreferenciador de symlinks Omarchy</text>
      <text x="15" y="98" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">• Exportador de AGENTS.md e GEMINI.md</text>
    </g>

    <!-- Adapter Storage -->
    <g transform="translate(975, 0)">
      <rect width="305" height="120" rx="12" fill="url(#card-adapter)" stroke="#059669" stroke-width="1.5"/>
      <text x="15" y="24" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">DRIVEN ADAPTER</text>
      <text x="15" y="46" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">crates/adapter-storage</text>
      <text x="15" y="66" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">• Snapshot Tar + Zstandard multi-threaded</text>
      <text x="15" y="82" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">• Zip-Slip / Path Traversal Guard estrito</text>
      <text x="15" y="98" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">• Preservação de modos POSIX (0700/0600)</text>
    </g>
  </g>

  <!-- LAYER 5: EXTERNAL WORLD TARGETS (FOOTER BADGES) -->
  <g transform="translate(60, 860)">
    <rect width="1280" height="60" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    
    <g transform="translate(25, 18)">
      <circle cx="8" cy="12" r="5" fill="#f59e0b"/>
      <text x="24" y="16" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12"><tspan fill="#f59e0b" font-weight="700">Zen Filesystem:</tspan> ~/.config/zen/ &amp; zen-sessions.jsonlz4</text>
    </g>
    <g transform="translate(360, 18)">
      <circle cx="8" cy="12" r="5" fill="#f59e0b"/>
      <text x="24" y="16" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12"><tspan fill="#f59e0b" font-weight="700">AppImages &amp; FUSE:</tspan> ~/AppImages &amp; libfuse.so.2</text>
    </g>
    <g transform="translate(680, 18)">
      <circle cx="8" cy="12" r="5" fill="#f59e0b"/>
      <text x="24" y="16" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12"><tspan fill="#f59e0b" font-weight="700">Package Backends:</tspan> pacman, paru, flatpak, dnf, apt</text>
    </g>
    <g transform="translate(1010, 18)">
      <circle cx="8" cy="12" r="5" fill="#f59e0b"/>
      <text x="24" y="16" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12"><tspan fill="#f59e0b" font-weight="700">Snapshot Vault:</tspan> .tar.zst com SHA-256 Checksum</text>
    </g>
  </g>

</svg>
